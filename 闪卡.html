<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>材料科学基础 · 闪卡学习</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1f2937;
    --sub: #6b7280;
    --accent: #3b82f6;
    --accent-soft: #dbeafe;
    --good: #16a34a;
    --good-soft: #dcfce7;
    --bad: #dc2626;
    --bad-soft: #fee2e2;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(18px + env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom));
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  header { width: 100%; max-width: 780px; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 2px; }
  .subtitle { color: var(--sub); font-size: 13px; margin-bottom: 14px; }

  .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .tab {
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 14px;
    transition: all .15s; min-height: 42px;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab .cnt { opacity: .75; font-size: 12px; margin-left: 4px; }

  .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    padding: 7px 13px; border-radius: 10px; cursor: pointer; font-size: 13px;
    transition: all .15s; min-height: 40px;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .stats {
    display: flex; gap: 14px; justify-content: center; font-size: 13px;
    color: var(--sub); margin-bottom: 14px; flex-wrap: wrap;
  }
  .stats b { color: var(--ink); }

  .filters { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--border); background: transparent; color: var(--sub);
    padding: 4px 12px; border-radius: 14px; cursor: pointer; font-size: 12px;
  }
  .chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .card-zone { width: 100%; max-width: 780px; perspective: 1200px; }
  .card {
    position: relative; width: 100%; min-height: 300px;
    background: var(--card); border-radius: 18px; border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(31,41,55,.08);
    cursor: pointer; transition: transform .45s; transform-style: preserve-3d;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; padding: 30px 28px; border-radius: 18px;
  }
  .front { background: var(--card); }
  .back {
    background: var(--accent-soft); transform: rotateY(180deg);
    overflow-y: auto;
  }
  .cat { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .5px; margin-bottom: 10px; }
  .q { font-size: 19px; line-height: 1.7; flex: 1; }
  .a { font-size: 16px; line-height: 1.75; color: var(--ink); white-space: pre-wrap; }
  .hint { color: var(--sub); font-size: 12px; margin-top: 14px; text-align: center; }

  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .mark { padding: 11px 22px; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; color: #fff; }
  .mark.good { background: var(--good); }
  .mark.bad { background: var(--warn); }
  .mark:hover { filter: brightness(1.08); }

  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .opt {
    text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); cursor: pointer; font-size: 15px; line-height: 1.55; transition: all .15s;
    min-height: 48px;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt.correct { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 600; }
  .opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .opt:disabled { cursor: default; }
  .feedback {
    margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6;
    display: none; max-height: 55vh; overflow-y: auto;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--good-soft); color: #14532d; }
  .feedback.no { background: var(--bad-soft); color: #7f1d1d; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .progress-bar > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
  footer { color: var(--sub); font-size: 12px; margin-top: 22px; text-align: center; max-width: 640px; line-height: 1.7; }
  @media (max-width: 560px) {
    h1 { font-size: 19px; }
    .q { font-size: 17px; }
    .a { font-size: 15px; }
    .card { min-height: 250px; }
    .face { padding: 22px 18px; }
    .mark { padding: 13px 18px; width: 46%; max-width: 220px; }
    .actions { gap: 12px; }
    .tab { min-height: 44px; }
    .chip { min-height: 36px; }
  }
</style>
</head>
<body>
<header>
  <h1>材料科学基础 · 闪卡学习</h1>
  <div class="subtitle">共 8 章 · 进度自动保存在本机浏览器（localStorage）</div>
  <div class="tabs" id="deckTabs"></div>
  <div class="controls">
    <button class="btn" id="modeBtn">模式：浏览</button>
    <button class="btn" id="shuffleBtn">随机打乱</button>
    <button class="btn" id="resetBtn">重置本组进度</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
</header>

<div class="card-zone">
  <div class="card" id="card">
    <div class="face front" id="frontFace"></div>
    <div class="face back" id="backFace"></div>
  </div>
  <div class="actions" id="actions"></div>
</div>
<div class="progress-bar"><div id="pbar"></div></div>

<footer>使用建议：先「浏览」过一遍 → 用「选择题自测」检验 → 每天把「需复习」的卡片过一遍。<br>进度按卡片保存，换电脑或清浏览器缓存会丢失。</footer>

<script>
"use strict";

/* ============ 数据 ============ */
const MCQS = [
{c:"第1章 原子键合",q:"决定电子能量及与核的平均距离的量子数是",o:["主量子数","磁量子数","轨道角动量量子数","自旋量子数"],a:0,n:"主量子数 n 决定电子能量及与核的平均距离；l 决定轨道形状，m 决定空间取向，ms 决定自旋方向。"},
{c:"第1章 原子键合",q:"核外电子排布时优先排布在能量（　）的轨道",o:["最高","最低","适中","以上都不是"],a:1,n:"按能量最低原理，电子优先占据能量最低的轨道，先低后高依次填充。"},
{c:"第1章 原子键合",q:"属于物理键的是",o:["共价键","范德华力","离子键","金属键"],a:1,n:"物理键指范德华力（分子间作用力）；共价键、离子键、金属键都属于化学键。"},
{c:"第1章 原子键合",q:"高分子材料中的 C-H 化学键属于",o:["氢键","离子键","共价键","分子间作用力"],a:2,n:"C-H 键是原子间共用电子对形成的共价键；氢键和分子间作用力作用于分子之间，不是分子内部。"},
{c:"第1章 原子键合",q:"极化可使键性由（　）过渡，最终使晶体结构类型发生变化",o:["共价键向离子键","离子键向共价键","金属键向共价键","金属键向离子键"],a:1,n:"极化使离子电子云变形、键的共价成分增加，所以键性由离子键向共价键过渡，晶体结构类型随之变化。"},
{c:"第1章 原子键合",q:"具有良好的导电性和导热性能的材料是",o:["无机非金属材料","合成材料","复合材料","金属材料"],a:3,n:"金属靠自由电子（电子气）导电导热，性能最好；陶瓷、聚合物没有自由电子。"},
{c:"第1章 原子键合",q:"不具有良好的导电性和导热性能的材料是",o:["铜","铁","聚乙烯塑料","铝"],a:2,n:"聚乙烯是高分子聚合物，无自由电子，不导电不导热；铜、铁、铝都是金属。"},

{c:"第2章 晶体结构",q:"空间点阵的特点是",o:["阵点周围环境都相同，在空间的位置一定","阵点周围环境不同，在空间的位置一定","阵点周围环境都相同，在空间的位置无序","阵点周围环境不同，在空间的位置无序"],a:0,n:"空间点阵要求阵点周围环境完全相同且空间位置确定，这是点阵区别于一般质点排列的本质。"},
{c:"第2章 晶体结构",q:"某晶面在 x、y、z 轴上的截距分别为 3a、2b、c，晶面指数为",o:["（236）","（321）","[236]","[321]"],a:0,n:"截距取倒数：1/3、1/2、1，通分×6 得 (236)；晶面指数用圆括号。"},
{c:"第2章 晶体结构",q:"某晶面在 x、y、z 轴上的截距分别为 a、2b、2c，晶面指数为",o:["（122）","（211）","[122]","[211]"],a:1,n:"截距取倒数：1、1/2、1/2，×2 得 (211)。"},
{c:"第2章 晶体结构",q:"符号 [uvw] 表示",o:["晶面指数","晶面族","晶向指数","晶向族"],a:2,n:"[uvw] 是晶向指数（方括号），(hkl) 是晶面指数（圆括号）。"},
{c:"第2章 晶体结构",q:"符号 <uvw> 表示",o:["晶面指数","晶面族","晶向指数","晶向族"],a:3,n:"<uvw> 表示晶向族，{hkl} 表示晶面族。"},
{c:"第2章 晶体结构",q:"在立方晶系中，相同指数的晶面和晶向",o:["平行","呈 45 度夹角","垂直","以上都不是"],a:2,n:"立方晶系中 (hkl) 与 [hkl] 互相垂直，如 (100)⊥[100]。"},
{c:"第2章 晶体结构",q:"每个体心立方晶胞含有（　）个原子",o:["2","4","6","8"],a:0,n:"bcc 晶胞：8 个顶点各占 1/8 + 1 个体心原子 = 2 个。"},
{c:"第2章 晶体结构",q:"一个体心立方晶胞含有（　）个原子",o:["3","2","4","1"],a:1,n:"体心立方：8×1/8（顶点）+ 1（体心）= 2 个原子。"},
{c:"第2章 晶体结构",q:"等径球体作紧密堆积，其堆积系数为",o:["68%","80%","74%","64%"],a:2,n:"等径球最紧密堆积（fcc/hcp）堆积系数 74%；bcc 为 68%。"},
{c:"第2章 晶体结构",q:"按（　）层序堆积构成六方最紧密堆积",o:["ABAB…","ABCABC…","ABBABB…","AABAAB…"],a:0,n:"ABAB… 两层一重复是六方最紧密堆积（hcp）；ABCABC… 是面心立方（fcc）。"},
{c:"第2章 晶体结构",q:"八面体和四面体两种间隙分别由（　）个等大球体构成",o:["8 和 4","4 和 8","4 和 6","6 和 4"],a:3,n:"八面体间隙由 6 个球围成，四面体间隙由 4 个球围成（记：八面=6，四面=4）。"},
{c:"第2章 晶体结构",q:"金刚石很硬而石墨很软，原因是",o:["晶体结构不同","两者成分不同","两者内部组织不同","生产制备工艺不同"],a:0,n:"金刚石是 sp³ 共价键三维骨架，极硬；石墨层内共价、层间范德华力弱，很软。成分相同，结构不同。"},

{c:"第3章 晶体缺陷",q:"下列缺陷中属于点缺陷的是",o:["空位","位错","晶界","相界"],a:0,n:"点缺陷（0 维）：空位、间隙原子、置换原子；位错是线缺陷，晶界/相界是面缺陷。"},
{c:"第3章 晶体缺陷",q:"实际晶体的线缺陷表现为",o:["空位","间隙原子","位错","晶界"],a:2,n:"线缺陷（1 维）即各种位错，表现为位错线。"},
{c:"第3章 晶体缺陷",q:"下列晶体缺陷中属于面缺陷的是",o:["空位","位错","晶界","间隙原子"],a:2,n:"面缺陷（2 维）：晶界、相界、孪晶界；空位和间隙原子是点缺陷。"},
{c:"第3章 晶体缺陷",q:"氮、氧在金属中一般占据间隙位置，这是因为",o:["金属中间隙半径大于氮氧原子半径","氮、氧都是气体","氮、氧原子半径较小，能挤入间隙位置","易于形成间隙化合物"],a:2,n:"间隙固溶体要点：溶质原子半径小，能挤入金属的间隙位置（间隙尺寸本身小于原子半径）。"},
{c:"第3章 晶体缺陷",q:"金属中溶质原子或杂质原子的存在",o:["总是使晶格常数增大","总是使晶格常数减小","可能使晶格常数增大也可能减小","对晶格常数没有影响"],a:2,n:"间隙原子使晶格膨胀，置换原子视相对大小而定，所以晶格常数可能增大也可能减小。"},
{c:"第3章 晶体缺陷",q:"金属与电负性较强的 IVA、VA、VIA 族元素按原子价规律形成的化合物称为",o:["电子化合物","正常价化合物","间隙化合物","以上都不是"],a:1,n:"按原子价规律形成的是正常价化合物；按电子浓度规律形成的是电子化合物。"},
{c:"第3章 晶体缺陷",q:"电子化合物中 A 组元质量分数超过 60%，该相晶体结构",o:["与 A 相同","与 B 相同","与 A、B 都不相同","不确定"],a:2,n:"电子化合物的结构由电子浓度决定，与 A、B 组元的结构都不同。"},
{c:"第3章 晶体缺陷",q:"关于位错性质，下列说法不正确的是",o:["位错不一定是直线","位错是已滑移区和未滑移区的边界","位错可以中断于晶体内部","位错不能中断于晶体内部"],a:2,n:"位错不能中断于晶体内部，只能终止于表面、晶界或形成闭合位错环，所以 C 说法错误。"},
{c:"第3章 晶体缺陷",q:"混合型位错的位错线与伯氏矢量",o:["垂直","平行","呈一定角度","以上都不是"],a:2,n:"刃位错 b⊥位错线，螺位错 b∥位错线，混合位错 b 与位错线呈一定角度。"},
{c:"第3章 晶体缺陷",q:"下列说法不正确的是",o:["扩展位错是线缺陷","螺位错旋向不变而刃位错正负反向","一个位错环不可能处处是刃位错，也不可能处处都是螺位错","柏氏矢量是点阵的平移矢量"],a:2,n:"位错环可以处处是刃位错（如棱柱位错环），所以『不可能处处是刃/螺』的说法不正确。"},
{c:"第3章 晶体缺陷",q:"面心立方单位位错的伯氏矢量大小是",o:["√2/2·a","√3/2·a","√3/3·a","a/2"],a:0,n:"b=a/2⟨110⟩，|b|=√[(a/2)²+(a/2)²]=√2/2·a。"},
{c:"第3章 晶体缺陷",q:"面心立方单位位错的伯氏矢量是",o:["a/2<110>","a<100>","a/2<111>","a/3<111>"],a:0,n:"面心立方最密方向是 ⟨110⟩，单位位错 b=a/2⟨110⟩。"},
{c:"第3章 晶体缺陷",q:"体心立方单位位错的伯氏矢量是",o:["a/2<110>","a<100>","a/2<111>","a/3<111>"],a:2,n:"体心立方最密方向是 ⟨111⟩，单位位错 b=a/2⟨111⟩，|b|=√3/2·a。"},

{c:"第4章 塑性变形与再结晶",q:"密排六方金属的滑移系有（　）个",o:["12","6","3","4"],a:2,n:"hcp 只有基面 1 个滑移面 × 3 个滑移方向 = 3 个滑移系，所以塑性差、易孪生。"},
{c:"第4章 塑性变形与再结晶",q:"金属晶体塑性变形方式主要以（　）为主",o:["再结晶","滑移","熔化","孪生"],a:1,n:"塑性变形主要靠位错滑移完成，孪生只起辅助作用。"},
{c:"第4章 塑性变形与再结晶",q:"在切应力作用下，螺型位错可以进行",o:["攀移","滑移","攀移和滑移","以上都不是"],a:1,n:"螺位错没有多余半原子面，不能攀移，只能滑移；攀移是刃位错特有的运动。"},
{c:"第4章 塑性变形与再结晶",q:"位错在热缺陷作用下垂直滑移面的运动称为",o:["攀移","滑移","增殖","减少"],a:0,n:"攀移借助热缺陷（空位/间隙原子扩散）在垂直于滑移面方向运动，是刃位错的行为。"},
{c:"第4章 塑性变形与再结晶",q:"位错的滑移是指位错在（　）作用下在滑移面上的运动",o:["外力","热应力","化学力","结构应力"],a:0,n:"滑移由外加切应力驱动，位错在滑移面上运动，产生永久（塑性）变形。"},
{c:"第4章 塑性变形与再结晶",q:"晶体转动使原有利于滑移的晶面变成不利于滑移，这种现象称为",o:["物理硬化","几何硬化","加工硬化","不确定"],a:1,n:"滑移时晶体转动使晶面远离 45°，取向因子变小、分切应力变小，滑移变难，即几何硬化。"},
{c:"第4章 塑性变形与再结晶",q:"加工硬化现象经过（　）可以消除",o:["再结晶","滑移","结晶","以上都不是"],a:0,n:"再结晶形成新的等轴晶、位错密度大幅下降，可消除加工硬化；回复只能降低残余应力。"},

{c:"第5章 扩散",q:"菲克第一定律要求各处浓度及浓度梯度不随（　）改变",o:["距离","时间","温度","时间和温度"],a:1,n:"稳态扩散指浓度及浓度梯度不随时间改变；随时间改变的是非稳态，用菲克第二定律。"},
{c:"第5章 扩散",q:"菲克第二定律的误差函数解适用于",o:["无限长或半无限长扩散偶","衰减薄膜源","成分偏析的均匀化","以上都不是"],a:0,n:"误差函数解用于无限长/半无限长扩散偶（如渗碳）；衰减薄膜源用高斯解，均匀化用傅里叶级数解。"},

const DECKS = [
  { id:"mcq", name:"选择题", type:"quiz", items:MCQS },
  { id:"term", name:"名词解释", type:"flip", items:TERMS },
  { id:"formula", name:"公式与数字", type:"flip", items:FORMULAS }
];

/* ============ 状态 ============ */
const LS_KEY = "msf_flashcards_v1";
let progress = loadProgress();
let curDeck = 0;
let order = [];          // 当前顺序（卡片下标）
let idx = 0;             // order 内位置
let flipped = false;
let answered = false;
let sessionScore = 0, sessionTotal = 0;
let mode = "browse";     // browse | quiz
let filter = "all";      // all | review | done

function loadProgress(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; }
}
function saveProgress(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch(e){}
}
function deckState(d){
  if(!progress[d.id]) progress[d.id] = {};
  return progress[d.id];
}
function cardState(d, i){
  const st = deckState(d);
  if(!(i in st)) st[i] = "new";
  return st[i];
}

/* ============ 渲染 ============ */
const $ = s => document.querySelector(s);

function renderTabs(){
  $("#deckTabs").innerHTML = DECKS.map((d,i) =>
    `<button class="tab${i===curDeck?' active':''}" data-i="${i}">${d.name}<span class="cnt">${d.items.length}</span></button>`
  ).join("");
}

function renderFilters(){
  const st = deckState(DECKS[curDeck]);
  let nDone=0, nReview=0;
  Object.values(st).forEach(v => { if(v==="done") nDone++; if(v==="review") nReview++; });
  $("#filters").innerHTML = `
    <button class="chip${filter==='all'?' active':''}" data-f="all">全部 ${DECKS[curDeck].items.length}</button>
    <button class="chip${filter==='review'?' active':''}" data-f="review">需复习 ${nReview}</button>
    <button class="chip${filter==='done'?' active':''}" data-f="done">已掌握 ${nDone}</button>`;
}

function renderStats(){
  const st = deckState(DECKS[curDeck]);
  let nDone=0, nReview=0, nNew=0;
  Object.values(st).forEach(v => { if(v==="done") nDone++; else if(v==="review") nReview++; else nNew++; });
  $("#stats").innerHTML = `
    <span>本组：<b>${DECKS[curDeck].items.length}</b> 张</span>
    <span>已掌握 <b style="color:var(--good)">${nDone}</b></span>
    <span>需复习 <b style="color:var(--warn)">${nReview}</b></span>
    <span>未开始 <b>${nNew}</b></span>
    <span>本次自测 <b>${sessionScore}/${sessionTotal}</b></span>`;
  const total = DECKS[curDeck].items.length;
  $("#pbar").style.width = (total ? Math.round((nDone+nReview)/total*100) : 0) + "%";
}

function currentIndex(){
  if(order.length===0) return -1;
  return order[idx];
}

function filterMatches(d, i){
  const s = cardState(d, i);
  if(filter==="review") return s==="review";
  if(filter==="done") return s==="done";
  return true;
}

function rebuildOrder(){
  const d = DECKS[curDeck];
  order = d.items.map((_,i)=>i).filter(i => filterMatches(d,i));
  idx = 0;
  flipped = false; answered = false;
}

function renderCard(){
  const d = DECKS[curDeck];
  const ci = currentIndex();
  $("#card").classList.remove("flipped");
  flipped = false; answered = false;
  if(ci === -1){
    $("#frontFace").innerHTML = `<div style="margin:auto;text-align:center;color:var(--sub)"><div style="font-size:44px;margin-bottom:10px">🎉</div>当前筛选下没有卡片了</div>`;
    $("#backFace").innerHTML = "";
    $("#actions").innerHTML = `<button class="btn primary" id="resetFilter">查看全部</button>`;
    $("#actions").querySelector("#resetFilter").onclick = () => { filter="all"; rebuildOrder(); renderAll(); };
    return;
  }
  const item = d.items[ci];
  const isFlip = d.type === "flip";
  const browseMcq = d.type === "quiz" && mode === "browse";
  $("#frontFace").innerHTML = `<div class="cat">${item.c} · ${ci+1}/${d.items.length}</div><div class="q">${item.q}</div>` +
    (isFlip || browseMcq ? `<div class="hint">点击卡片查看答案</div>` : `<div class="hint">选择题模式：点击选项作答，答完看解析</div>`);

  if(isFlip){
    $("#backFace").innerHTML = `<div class="cat">答案</div><div class="a">${item.a}</div>`;
    $("#actions").innerHTML = `
      <button class="mark bad" id="mReview">还需复习</button>
      <button class="mark good" id="mDone">记住了</button>`;
    $("#mReview").onclick = () => markCard("review");
    $("#mDone").onclick = () => markCard("done");
  } else {
    if(browseMcq){
      const L = "ABCD";
      $("#backFace").innerHTML = `<div class="cat">答案与解析</div><div class="a">正确答案：${L[item.a]}. ${item.o[item.a]}\n\n解析：${item.n}</div>`;
    } else {
      $("#backFace").innerHTML = "";
    }
    $("#actions").innerHTML = `<div class="options" id="opts"></div><div class="feedback" id="fb"></div>`;
    const opts = $("#opts");
    item.o.forEach((opt, oi) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<b>${"ABCD"[oi]}.</b> ${opt}`;
      b.onclick = () => answer(oi);
      opts.appendChild(b);
    });
  }
}

function answer(oi){
  if(answered) return;
  const d = DECKS[curDeck];
  const ci = currentIndex();
  const item = d.items[ci];
  answered = true;
  sessionTotal++;
  const correct = oi === item.a;
  if(correct) sessionScore++;
  const opts = [...$("#opts").children];
  opts.forEach((b, bi) => { b.disabled = true; if(bi===item.a) b.classList.add("correct"); if(bi===oi && !correct) b.classList.add("wrong"); });
  const fb = $("#fb");
  fb.className = "feedback show " + (correct ? "ok" : "no");
  fb.innerHTML = correct
    ? `✔ 答对了！正确答案：${"ABCD"[item.a]}. ${item.o[item.a]}<br><b>解析：</b>${item.n}`
    : `✘ 答错了。正确答案：${"ABCD"[item.a]}. ${item.o[item.a]}<br><b>解析：</b>${item.n}`;
  const old = cardState(d, ci);
  if(correct && old !== "done") { deckState(d)[ci] = "done"; saveProgress(); }
  else if(!correct) { deckState(d)[ci] = "review"; saveProgress(); }
  $("#actions").insertAdjacentHTML("beforeend", `<button class="btn primary" id="nextQ" style="margin-top:12px">下一题 →</button>`);
  $("#nextQ").onclick = () => { next(); };
  renderStats(); renderFilters();
}

function markCard(v){
  const d = DECKS[curDeck];
  const ci = currentIndex();
  if(ci === -1) return;
  deckState(d)[ci] = v;
  saveProgress();
  next();
}

function next(){
  if(idx < order.length - 1){ idx++; } else { idx = 0; }
  renderCard(); renderStats(); renderFilters();
}

function renderAll(){
  renderTabs(); renderFilters(); renderStats(); renderCard();
  $("#modeBtn").textContent = mode === "quiz" ? "模式：自测" : "模式：浏览";
  $("#modeBtn").style.display = DECKS[curDeck].type === "quiz" ? "" : "none";
}

/* ============ 事件 ============ */
$("#deckTabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if(!t) return;
  curDeck = +t.dataset.i;
  filter = "all"; mode = "browse"; sessionScore = 0; sessionTotal = 0;
  rebuildOrder(); renderAll();
});
$("#filters").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  filter = c.dataset.f;
  rebuildOrder(); renderAll();
});
$("#card").addEventListener("click", () => {
  const d = DECKS[curDeck];
  const canFlip = d.type === "flip" || (d.type === "quiz" && mode === "browse");
  if(!canFlip || currentIndex() === -1) return;
  flipped = !flipped;
  $("#card").classList.toggle("flipped", flipped);
});
$("#modeBtn").addEventListener("click", () => {
  mode = mode === "browse" ? "quiz" : "browse";
  rebuildOrder(); renderAll();
});
$("#shuffleBtn").addEventListener("click", () => {
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0;
  renderCard();
});
$("#resetBtn").addEventListener("click", () => {
  if(!confirm("确定重置当前组的全部进度吗？")) return;
  progress[DECKS[curDeck].id] = {};
  saveProgress();
  sessionScore = 0; sessionTotal = 0;
  rebuildOrder(); renderAll();
});

/* 键盘：空格翻卡/下一题 */
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.code === "Space"){
    e.preventDefault();
    const d = DECKS[curDeck];
    const canFlip = d.type === "flip" || (d.type === "quiz" && mode === "browse");
    if(canFlip){ flipped = !flipped; $("#card").classList.toggle("flipped", flipped); }
  }
});

/* ============ 启动 ============ */
rebuildOrder();
renderAll();
</script>
</body>
</html>
